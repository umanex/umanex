name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type-check, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check, lint, build
        run: pnpm turbo type-check lint build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          # Placeholders, geen secrets: cashflow inlineert deze NEXT_PUBLIC-waardes
          # tijdens de build, dus zonder waarde faalt het prerenderen. CI bouwt een
          # wegwerp-artefact en deployt niet — de echte waardes staan bij Vercel,
          # waar de hard-fail in lib/supabase/client.ts een misconfiguratie blijft
          # tegenhouden.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # De Storybook van packages/ui draait zijn eigen Vite/PostCSS-keten en zit dus niet
      # in de build hierboven. Een story of docs-blok dat niet meer compileert (verwijderde
      # export, verplaatst component, kapotte MDX) zou anders pas opvallen bij de volgende
      # `pnpm storybook` op iemands machine. Eigen stap, zodat de fout in het log bij zijn
      # naam staat en niet ergens in de output van twintig andere builds.
      - name: Build — Storybook (packages/ui)
        run: pnpm turbo build-storybook
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      # Node draait TypeScript zelf (type-stripping), dus dit kost geen testrunner en
      # geen dependency. De bestanden bestonden al maar werden door niets aangeroepen —
      # een test die alleen draait wanneer iemand eraan denkt, meet niets.
      #
      # `git ls-files` in plaats van een glob: shell-globbing verschilt per runner en
      # een patroon dat niets matcht faalt stil op de verkeerde manier. Zo pikt de stap
      # bovendien elk nieuw *.test.ts vanzelf op, zonder deze lijst bij te werken.
      #
      # `--experimental-strip-types` is op Node 22 nodig en op nieuwere versies een
      # geaccepteerde no-op; expliciet meegeven maakt de stap onafhankelijk van welke
      # 22.x de runner toevallig oplevert.
      - name: Guard — invarianten (node:test)
        run: |
          files=$(git ls-files '*.test.ts')
          if [ -z "$files" ]; then
            echo "::error::Geen *.test.ts gevonden. Deze stap hoort iets te draaien; een lege lijst is een fout, geen succes."
            exit 1
          fi
          echo "$files"
          node --experimental-strip-types --test $files

      # De gegenereerde token-output staat in git, maar niets toetste of hij nog
      # matcht met tokens.json. Een PR die tokens.json wijzigt zonder te herbouwen
      # (of omgekeerd) kon dus groen zijn, en de drift kwam pas boven bij de
      # volgende Figma-push. De build hierboven heeft de outputs net herschreven —
      # als er iets verschilt, was de gecommitte versie stale.
      - name: Guard — gegenereerde tokens zijn in sync met tokens.json
        run: |
          if ! git diff --exit-code -- packages/tokens/build; then
            echo "::error::De gecommitte token-output wijkt af van wat de build produceert. Draai 'pnpm --filter @umanex/tokens build' en commit het resultaat."
            exit 1
          fi

      # ESLint ziet de SVG fill=/stroke=-attributen en de .css-bestanden niet, en
      # packages/ui heeft geen eslint-config. Deze guard dekt alles op schijf.
      - name: Guard — laag-discipline (geen primitives of rauwe kleuren in app-code)
        run: pnpm --filter @umanex/tokens guard

      # Toetst de rollaag zelf: elk vlak tegen zijn eigen tekstkleur, en elke vrije
      # tekstrol tegen elk oppervlak waar hij op kan landen. Superset — hij weet niet
      # welke combinaties de apps echt gebruiken, dus een treffer is altijd echt.
      - name: Guard — contrast van de rollaag (WCAG AA)
        run: pnpm --filter @umanex/tokens contrast

      # rowtrack-web draait op RowTrack's eigen rollaag. Tailwind slaat een onbekende
      # klasse in een className stil over, dus `border-border-defualt` rendert geen
      # fout maar Tailwinds eigen kleur — een waarde die uit geen enkel token komt.
      # Deze guard vangt dat; @apply deed het al, een className niet.
      - name: Guard — rol-utilities bestaan echt (rowtrack-web)
        run: pnpm --filter @umanex/rowtrack-tokens guard

      # Twee tegenproeven, want een guard die draait is nog geen guard die meet.
      # De zelftest bewijst dat hij afgaat op het geval waarvoor hij gebouwd is; de
      # marge-meting bewijst dat zijn tikfout-drempel nog niet aan een echte
      # Tailwind-klasse raakt. Zakt die marge naar nul, dan gaat CI stuk vóór de
      # guard vals alarm begint te slaan.
      # Elke app declareert in zijn CLAUDE.md welke preset, welke componentbron en welke
      # Storybook hij gebruikt; deze guard toetst die declaratie tegen wat er op schijf staat.
      # De as die ertoe doet is [adoptie]: een workspace-dependency die geen enkel app-bestand
      # importeert leest als adoptie zonder het te zijn. Zo droeg cashflow @umanex/ui maanden
      # in package.json terwijl de enige importeur een render-script was.
      #
      # De tegenproef draait ernaast, want een guard die draait is nog geen guard die meet:
      # de eerste versie stond groen op precies die app, omdat next.config.mjs de package in
      # transpilePackages noemt en het meetbereik de app-root meenam.
      # PR-verwijzingen in de markdown: bestaan ze, en zeggen ze uit welke repo ze komen?
      # Een kaal #N in de gesynchroniseerde laag (.umanex-os/, .claude/skills/) reist mee
      # naar elke klant-repo en wijst daar naar een andere PR. Het bestáán kan de
      # pre-commit hook niet toetsen — die heeft geen netwerk en kan een echt nummer niet
      # van een plausibel nummer onderscheiden. Vandaar deze stap, met zijn zelftest.
      #
      # Wat hij NIET vangt: een nummer dat bestaat maar het verkeerde is. Daar helpt alleen
      # de volgorde — eerst de call, dan het nummer opschrijven. Zie .umanex-os/CLAUDE.md.
      - name: Guard — PR-verwijzingen gekwalificeerd en bestaand (met zelftest)
        run: |
          node scripts/refs-check.mjs --selftest
          node scripts/refs-check.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — design-systeem-bron per app (met tegenproef)
        run: pnpm ds:guard:selftest

      - name: Guard — tegenproef op de rol-utility-guard
        run: |
          pnpm --filter @umanex/rowtrack-tokens guard:selftest
          node packages/rowtrack-tokens/scripts/margin.mjs

      # De check hierboven kent alleen de tokens. Wat er in een component écht ontstaat —
      # tekst op een geneste achtergrond, een alpha-vlak boven een ander vlak — zag tot nu
      # toe alleen een mens in een browserconsole, met drie meetfouten onderweg. Deze sweep
      # meet dat op de gerenderde DOM van de harness: geen server, geen sessie, één
      # statisch bestand.
      - name: Cache Playwright-browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Playwright Chromium
        run: pnpm --filter cashflow exec playwright install --with-deps chromium

      # `verify:visual` rendert de harness uit de build hierboven en sweept hem daarna.
      # De sweep draait zijn eigen zelftest mee — een guard die niet kán falen meldt
      # "0 fouten" even overtuigend als een die werkt.
      # De sync-guard toetst namen, variant-assen, tokenwaarden en typografie-herkomst —
      # geen enkele van die assen raakt een MAAT. Deze stap meet de gerenderde doosmaten van
      # elke story tegen een gecommitteerde basislijn. Vereist de Storybook-build hierboven
      # en de Chromium uit de stap ervoor.
      - name: Guard — gerenderde maten van packages/ui tegen de basislijn
        run: pnpm --filter @umanex/ui geometry

      - name: Guard — contrast van de gerenderde DOM (WCAG AA)
        run: pnpm --filter cashflow verify:visual

      # De rekenkern van cashflow rolt door: het eindsaldo van maand N is het beginsaldo van
      # N+1, en een pot draagt zijn stand mee. Een fout daar is per scherm onzichtbaar en
      # per keten fataal, dus de dekking zit in invarianten die over het hele model rekenen.
      # Twee suites, 594 checks; ze draaiden tot 2026-08-08 alleen met de hand.
      - name: Guard — invarianten op de rekenkern (buffer + anker)
        run: pnpm --filter cashflow scenarios

      # De sleep tussen twee maandkolommen is het enige pad dat noch de sweep noch de
      # scenario's raken: hij hangt aan dnd-kit én de store. De harness rijdt hem uit met
      # toetsenbord en muis tegen de build hierboven, en onderschept élk verzoek naar de
      # Supabase-origin — ook de wegschrijf-call, die geteld wordt in plaats van verstuurd.
      # `flow:ci` serveert de build van de stap hierboven (`--dist=.next`: alleen lezen,
      # nooit bouwen) en voegt de tegenproeven toe die hóren te falen. Lokaal bouwt de
      # harness zelf in `.next-harness`, zodat hij de `.next` van PM2 niet raakt.
      - name: Guard — flow (sleep tussen maandkolommen)
        run: pnpm --filter cashflow flow:ci
        env:
          # Dezelfde placeholder als de build. De harness leest hem om te weten welke origin
          # hij moet dichtzetten — zonder die waarde weigert hij te starten, en dat hoort zo.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # De leadscore van jobradar is een afgeleide van een afgeleide: hij volgt uit de
      # signalen, die volgen uit de design/dev-classificatie, die volgt uit de keyword-match.
      # Een fout onderin is per kaart onzichtbaar en over de hele feed structureel — dus
      # invarianten die over de dataset rekenen, geen verwachte uitkomst per geval. De suite
      # draait zijn eigen tegenproef vooraf en heeft netwerk noch database nodig.
      - name: Guard — invarianten op de scorekern (jobradar)
        run: pnpm --filter jobradar scenarios

      # Storybook en het Figma-bestand "Component library" moeten één op één blijven:
      # elke component een eigen pagina, elke variant-as aan beide kanten hetzelfde,
      # elke tokenrol een variable, elke deep-link naar een bestaande node. De guard
      # leest de neergeslagen Figma-staat uit packages/ui/figma/manifest.json — CI heeft
      # geen Figma-toegang, dus dat bestand is de meting, niet de bron. Wat hij dus NIET
      # ziet: een wijziging in Figma zonder verse manifest (zie packages/ui/CLAUDE.md).
      #
      # De selftest draait ervóór: hij bouwt per as het defect dat de guard moet vangen
      # en eist dat hij erop afgaat, plus een ongewijzigde kopie die groen moet blijven.
      # Zonder die twee kanten weet je niet of de guard meet of alleen draait.
      - name: Guard — Storybook ↔ Figma in sync (met tegenproef)
        run: pnpm --filter @umanex/ui figma:check:selftest
